name: daily-pull
# Card Hedge pull. The database lives on the `data` branch, encrypted with CARDHEDGE_API_KEY
# (see scripts/db_snapshot.sh), so the branch holds only ciphertext even in a public repo.
# Needs the repository secret CARDHEDGE_API_KEY. Scheduled runs only start from the default branch.
#
# Throughput: Card Hedge allows 5,000 calls/day at 10/minute (~8.3 hours of calls), and a GitHub
# job may run at most 6 hours, so two runs a day share the 4,800-call budget (counted per UTC day
# in the database). Public repos have unlimited Actions minutes; a private repo's 2,000 free
# minutes/month would allow only ~45 minutes a day (set --minutes 45 and one schedule).
on:
  schedule:
    - cron: "17 0 * * *"          # 00:17 UTC, just after Card Hedge's daily allowance resets
    - cron: "47 6 * * *"          # finishes the day's allowance
  workflow_dispatch:
concurrency:
  group: daily-pull
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      CARDTRACKER_DB: data/cards.db
      CARDHEDGE_API_KEY: ${{ secrets.CARDHEDGE_API_KEY }}
      SNAPSHOT_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
    steps:
      - name: Require the API key
        run: |
          if [ -z "$CARDHEDGE_API_KEY" ]; then
            echo "::error::Add the repository secret CARDHEDGE_API_KEY (Settings > Secrets and variables > Actions)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - id: restore
        run: scripts/db_snapshot.sh restore "$CARDTRACKER_DB"
      - name: Calendars
        run: |
          cardtracker init-db
          cardtracker calendar fetch nfl
          cardtracker calendar fetch epl --first 2012 --last "$(date -u +%Y)"
          for f in calendars/*.csv; do cardtracker calendar import "$f"; done
      - name: Card Hedge (saves a snapshot every hour)
        run: |
          cardtracker ch daily --budget 4800 --minutes 320 &
          pull=$!
          while kill -0 "$pull" 2>/dev/null; do
            for i in $(seq 360); do kill -0 "$pull" 2>/dev/null || break; sleep 10; done
            kill -0 "$pull" 2>/dev/null && scripts/db_snapshot.sh save "$CARDTRACKER_DB"
          done
          wait "$pull"
      - name: Save database
        # Never after a failed restore: that would replace the stored database with a new one.
        if: always() && steps.restore.outcome == 'success'
        run: scripts/db_snapshot.sh save "$CARDTRACKER_DB"
