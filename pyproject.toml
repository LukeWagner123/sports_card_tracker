[project]
name = "cardtracker"
version = "0.1.0"
description = "Sports card price, population, and player-performance database for valuation research"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cardtracker = "cardtracker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cardtracker = ["schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
